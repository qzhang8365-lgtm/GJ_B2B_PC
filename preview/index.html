    .main{grid-area:main;min-width:0;display:flex;flex-direction:column;position:relative;background:transparent}.main::before{content:none}.topbar{grid-area:topbar;height:var(--docs-shell-topbar-height);background:var(--ds-background-wt-60);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border-bottom:0;box-shadow:none;display:flex;align-items:center;padding:0 22px 0 0;gap:8px;position:sticky;top:0;z-index:4}.topbar-divider{width:1px;height:22px;margin-right:14px;background:var(--ds-border-default)}.crumb{color:var(--ds-text-tertiary);font-size:13px}.crumb-current{color:var(--ds-text-primary);font-size:13px;font-weight:600}.crumb-dot{width:6px;height:6px;border-radius:50%;background:var(--ds-text-blue);box-shadow:0 0 0 3px var(--ds-background-bt-b10);margin-right:2px}.topbar-spacer{flex:1}.status{font-size:13px;color:var(--ds-text-secondary);background:var(--ds-background-wt-80);border:1px solid var(--ds-border-default);padding:5px 10px;border-radius:8px}.topbar-figma{display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--ds-text-secondary);font-size:13px;line-height:20px;text-decoration:none;padding:6px 12px;border:1px solid var(--ds-border-default);border-radius:8px;background:var(--ds-background-wt-80);transition:color .15s,border-color .15s}.topbar-figma:hover{color:var(--ds-text-blue);border-color:var(--ds-text-blue)}.topbar-figma svg{width:14px;height:14px;flex:none}.content{flex:1;min-height:0;position:relative;z-index:1}.content-frame{width:100%;height:100%;border:0;background:transparent;display:block}.placeholder{height:100%;display:none;place-items:center;padding:var(--docs-page-padding)}.placeholder.show{display:grid}.placeholder-card{max-width:520px;text-align:center;background:var(--ds-text-reversal);border:1px solid var(--ds-border-default);border-radius:var(--docs-panel-radius);padding:var(--docs-page-padding);box-shadow:0 8px 20px var(--ds-background-hover-2)}.placeholder-icon{width:48px;height:48px;margin:0 auto 14px;border-radius:12px;background:var(--blue-soft);color:var(--ds-text-blue);display:grid;place-items:center;font-size:22px}.placeholder h1{font-size:22px;margin:0 0 8px}.placeholder p{color:var(--ds-text-secondary);margin:0;line-height:1.7}.mobile-toggle{display:none;border:0;background:transparent;font-size:22px;cursor:pointer}
    html,body{height:auto;min-height:100%;overflow:visible}.app{height:auto;min-height:100vh;align-items:start}.sidebar{position:sticky;top:var(--docs-shell-topbar-height);height:calc(100vh - var(--docs-shell-topbar-height))}.main{min-height:calc(100vh - var(--docs-shell-topbar-height))}.content{flex:none;min-height:calc(100vh - var(--docs-shell-topbar-height))}.content-frame{height:400px;overflow:hidden}.global-toast{position:fixed;left:calc(var(--nav-width) + (100vw - var(--nav-width))/2);bottom:28px;transform:translate(-50%,14px);z-index:20;max-width:min(520px,calc(100vw - 40px));padding:10px 16px;border-radius:8px;background:var(--ds-background-mk-80);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 24px var(--ds-background-mk-20);color:var(--ds-text-reversal);font-size:13px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}.global-toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.app{display:block;height:auto;min-height:100%;padding-top:var(--docs-shell-topbar-height)}.sidebar{position:fixed;z-index:5;inset:var(--docs-shell-topbar-height) auto 0 0;width:var(--nav-width);height:calc(100vh - var(--docs-shell-topbar-height));transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 24px var(--ds-background-mk-10);background:var(--ds-background-background)}.sidebar.open{transform:none}.mobile-toggle{display:block;margin-left:14px}.topbar{position:fixed;inset:0 0 auto 0;z-index:6;padding-left:0}.topbar-divider{display:none}.brand{width:auto;padding:0 12px}.brand-sub{display:none}.content{min-height:calc(100vh - var(--docs-shell-topbar-height))}.status{display:none}.topbar-figma{display:none}.global-toast{left:50%}}
  </style>
  <script src="../assets/scripts/font-runtime.js"></script>

<body>
<div class="app">
  <header class="topbar"><button class="mobile-toggle" id="mobileToggle" aria-label="打开导航">☰</button><div class="brand"><div class="brand-mark">GJ</div><div><div class="brand-title">B端设计系统</div><div class="brand-sub">组件交互验收工作台</div></div></div><span class="topbar-divider" aria-hidden="true"></span><span class="crumb-dot" aria-hidden="true"></span><span class="crumb" id="crumbGroup">通用组件</span><span class="crumb">/</span><span class="crumb-current" id="crumbPage">按钮 Button</span><span class="topbar-spacer"></span><a class="topbar-figma" href="https://www.figma.com/design/8b01I1e3TzH1IhYlr3tJzd" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 24c2.2 0 4-1.79 4-4v-4H8c-2.2 0-4 1.79-4 4s1.8 4 4 4Z" fill="#0ACF83"/><path d="M4 12c0-2.21 1.8-4 4-4h4v8H8c-2.2 0-4-1.79-4-4Z" fill="#A259FF"/><path d="M4 4c0-2.21 1.8-4 4-4h4v8H8C5.8 8 4 6.21 4 4Z" fill="#F24E1E"/><path d="M12 0h4c2.2 0 4 1.79 4 4s-1.8 4-4 4h-4V0Z" fill="#FF7262"/><path d="M20 12c0 2.21-1.8 4-4 4s-4-1.79-4-4 1.8-4 4-4 4 1.79 4 4Z" fill="#1ABCFE"/></svg>在 Figma 中查看</a></header>
  <aside class="sidebar" id="sidebar">
    <nav class="nav-scroll" id="navigation" aria-label="设计系统导航"></nav>
  </aside>
  <main class="main">
    <section class="content"><iframe class="content-frame" id="contentFrame" title="组件交互预览" scrolling="no" allow="clipboard-write"></iframe><div class="placeholder" id="placeholder"><div class="placeholder-card"><div class="placeholder-icon">◇</div><h1 id="placeholderTitle"></h1><p>该规范页面尚未生成。后续完成提取后，将直接加入当前导航并替换此占位内容。</p></div></div></section>
  </main>
</div>
<div class="global-toast" id="globalToast" role="status" aria-live="polite"></div>
<script>
  const catalog=[
    {label:'基础规范',children:[
      {id:'color',label:'颜色 Color',url:'color/index.html?v=26',children:[
        {id:'color-semantic',label:'语义颜色',anchor:'semantic-colors'},
        {id:'color-palette',label:'全局色盘',anchor:'primitive-palette'},
        {id:'color-gradient',label:'渐变色',anchor:'gradient-colors'}
      ]},
      {id:'effects',label:'样式效果 Effects',url:'effects/index.html?v=1'},
      {id:'typography',label:'字体 Typography',url:'typography/index.html?v=8'},
      {id:'layout',label:'布局 Layout',url:'layout/index.html?v=10'},
      {id:'radius',label:'圆角 Radius',url:'radius/index.html?v=14'}
    ]},
    {label:'通用组件',children:[
      {id:'button',label:'按钮 Button',url:'button/index.html?v=5'},
      {id:'divider',label:'分割线 Divider',url:'divider/index.html?v=general-4'},
      {id:'icon',label:'图标 Icon',url:'icons/index.html?v=general-2',children:[
        {id:'icon-general',label:'通用图标',anchor:'icon-general'},
        {id:'icon-effect',label:'毛玻璃图标',anchor:'icon-effect'},
        {id:'icon-file',label:'文件图标',anchor:'icon-file'},
        {id:'icon-motion',label:'动效图标',anchor:'icon-motion'}
      ]},
      {id:'tag',label:'标签 Tag',url:'tag/index.html?v=general-3'}
    ]},
    {label:'导航组件',children:[
      {id:'sidebar',label:'侧边栏导航 Sidebar',url:'sidebar/index.html?v=sidebar-9'},
      {id:'navbar',label:'顶部导航栏 Navbar',url:'navbar/index.html?v=6'},
      {id:'tabs',label:'页签 Tabs',url:'tabs/index.html?v=5'},
      {id:'breadcrumb',label:'面包屑 Breadcrumb',url:'breadcrumb/index.html?v=3'},
      {id:'carousel',label:'走马灯 Carousel',url:'carousel/index.html?v=2'},
      {id:'pagination',label:'分页 Pagination',url:'pagination/index.html?v=3'},
      {id:'gridnav',label:'宫格导航 GridNav',url:'gridnav/index.html?v=11'}
    ]},
    {label:'信息录入组件',children:[
      {id:'input',label:'输入框 Input',url:'input/index.html?v=5'},
      {id:'checkbox',label:'多选框 Checkbox',url:'checkbox/index.html?v=1'},
      {id:'radio',label:'单选框 Radio',url:'radio/index.html?v=4'},
      {id:'switch',label:'开关 Switch',url:'switch/index.html?v=1'},
      {id:'date-picker',label:'日期选择器 DatePicker',url:'date-picker/index.html?v=11'},
      {id:'form',label:'表单 Form',url:'form/index.html?v=8'},
      {id:'selector',label:'选择器 Selector',url:'selector/index.html?v=4'},
      {id:'dropdown',label:'下拉菜单 Dropdown',url:'dropdown/index.html?v=3'},
      {id:'cascader',label:'级联选择 Cascader',url:'cascader/index.html?v=4'},
      {id:'search',label:'搜索框 Search',url:'search/index.html?v=2'},
      {id:'time-picker',label:'时间选择器 TimePicker',url:'time-picker/index.html?v=17'},
      {id:'input-number',label:'数字输入 Input-Number',url:'input-number/index.html?v=8'},
      {id:'upload',label:'上传 Upload',url:'upload/index.html?v=5'},
      {id:'image',label:'图片 Image',url:'image/index.html?v=2'}
    ]},
    {label:'信息展示组件',children:[
      {id:'table',label:'表格 Table',url:'table/index.html?v=23'},
      {id:'avatar',label:'头像 Avatar',url:'avatar/index.html?v=5'},
      {id:'badge',label:'徽标 Badge',url:'badge/index.html?v=2'},
      {id:'empty',label:'空状态 Empty',url:'empty/index.html?v=1'},
      {id:'steps',label:'步骤条 Steps',url:'steps/index.html?v=1'},
      {id:'timeline',label:'时间轴 Timeline',url:'timeline/index.html?v=2'},
      {id:'metric',label:'指标数据 Metric',url:'metric/index.html?v=4'},
      {id:'chart',label:'图表 Chart',url:'chart/index.html?v=57',children:[
        {id:'chart-foundation',label:'图表基础',anchor:'chart-foundation'},
        {id:'chart-line',label:'折线图',anchor:'chart-line'},
        {id:'chart-curve',label:'曲线图',anchor:'chart-curve'},
        {id:'chart-bar',label:'柱状图',anchor:'chart-bar'},
        {id:'chart-pie',label:'饼图与环形图',anchor:'chart-pie'},
        {id:'chart-percentage',label:'柱状百分比',anchor:'chart-percentage'},
        {id:'chart-radar',label:'雷达图',anchor:'chart-radar'},
        {id:'chart-gauge',label:'仪表盘',anchor:'chart-gauge'},
        {id:'chart-progress',label:'进度条',anchor:'chart-progress'},
        {id:'chart-progress-ring',label:'环状进度',anchor:'chart-progress-ring'},
        {id:'chart-wordcloud',label:'词云',anchor:'chart-wordcloud'}
      ]}
    ]},
    {label:'操作反馈类型组件',children:[
      {id:'toast',label:'轻提示 Toast',url:'toast/index.html?v=2'},
      {id:'modal',label:'弹窗 Modal',url:'modal/index.html?v=2'},
      {id:'notification',label:'通知 Notification',url:'notification/index.html?v=2'},
      {id:'tooltip',label:'文字提示 Tooltip',url:'tooltip/index.html?v=2'},
      {id:'popover',label:'居中弹出框 Popover',url:'popover/index.html?v=6'},
      {id:'drawer',label:'抽屉 Drawer',url:'drawer/index.html?v=5'},
      {id:'skeleton',label:'骨架屏 Skeleton',url:'skeleton/index.html?v=4'}
    ]}
  ];
  const nav=document.getElementById('navigation'),frame=document.getElementById('contentFrame'),placeholder=document.getElementById('placeholder'),sidebar=document.getElementById('sidebar');
  let frameObserver,pendingAnchor='',fitQueued=false;
  function fitFrame(){
    if(fitQueued)return;
    fitQueued=true;
    requestAnimationFrame(()=>{
      fitQueued=false;
      const doc=frame.contentDocument;
      if(!doc?.body)return;
      const contentRoot=doc.querySelector('main.shell')||doc.querySelector('main')||doc.body.firstElementChild||doc.body;
      const rect=contentRoot.getBoundingClientRect();
      const style=doc.defaultView.getComputedStyle(contentRoot);
      const marginBottom=parseFloat(style.marginBottom)||0;
      const height=Math.ceil(rect.bottom+(doc.defaultView.scrollY||0)+marginBottom);
      const current=parseFloat(frame.style.height)||0;
      if(height>0&&Math.abs(height-current)>1)frame.style.height=height+'px';
    });
  }
  function scrollToFrameAnchor(anchor){const doc=frame.contentDocument,target=doc?.getElementById(anchor);if(!target)return;const top=frame.getBoundingClientRect().top+window.scrollY+target.getBoundingClientRect().top-(doc.documentElement.scrollTop||doc.body?.scrollTop||0)-74;window.scrollTo({top:Math.max(0,top),behavior:'smooth'})}
  frame.addEventListener('load',()=>{
    frameObserver?.disconnect();
    const doc=frame.contentDocument;
    if(doc){
      const componentStyles=doc.createElement('link');
      componentStyles.rel='stylesheet';
      componentStyles.href='../../assets/styles/gj-b2b-components.css?v=general-2';
      componentStyles.addEventListener('load',fitFrame,{once:true});
      doc.head.insertBefore(componentStyles,doc.head.firstChild);
      const lightweightStyles=doc.createElement('style');
      lightweightStyles.textContent=':root{--preview-structure-border:color-mix(in srgb,var(--ds-border-default) 58%,transparent)}.shell{max-width:var(--docs-page-max-width)}.component,.button-section{border-radius:var(--docs-section-radius)!important;box-shadow:none!important}.panel,.demo-card,.stage-card,.section-card{border-color:var(--preview-structure-border)!important;border-radius:var(--docs-panel-radius)!important;box-shadow:none!important}.stage,.interaction-stage,.preview-stage,.interactive-stage,.component-stage{border-color:transparent!important;background:transparent!important;box-shadow:none!important}';
      doc.head.appendChild(lightweightStyles);
      const contentRoot=doc.querySelector('main.shell')||doc.querySelector('main')||doc.body.firstElementChild||doc.body;
      frameObserver=new ResizeObserver(fitFrame);
      frameObserver.observe(contentRoot);
      doc.fonts?.ready.then(fitFrame);
      doc.querySelectorAll('img').forEach(img=>{if(!img.complete)img.addEventListener('load',fitFrame,{once:true})});
      fitFrame();
      setTimeout(fitFrame,100);
      setTimeout(fitFrame,500);
    }
    if(pendingAnchor){requestAnimationFrame(()=>scrollToFrameAnchor(pendingAnchor));pendingAnchor=''}
  });
  const allPages=[];
  const navChevron='<img class="chevron" src="../assets/icons/iconfont/icf_Arrow_down-sm.svg" alt="">';
  function itemMarkup(item,level){allPages.push(item);const pending=item.url||item.anchor?'':' pending';const hasChildren=!!(item.children&&item.children.length);const children=hasChildren?`<div class="nav-subchildren">${item.children.map(child=>itemMarkup(child,level+1)).join('')}</div>`:'';return `<div class="nav-entry${hasChildren?' has-sub':''}"><button class="nav-item nav-level-${level}${pending}" data-id="${item.id}"><span class="dot"></span><span>${item.label}</span>${hasChildren?navChevron:''}</button>${children}</div>`}
  nav.innerHTML=catalog.map(group=>`<section class="nav-section"><button class="nav-level-1" aria-expanded="true"><span>${group.label}</span>${navChevron}</button><div class="nav-children">${group.children.map(item=>itemMarkup(item,2)).join('')}</div></section>`).join('');
  function findPage(id){for(const group of catalog){for(const item of group.children){if(item.id===id)return {group:group.label,item,parent:null};for(const child of item.children||[])if(child.id===id)return {group:group.label,item:child,parent:item}}}return null}
  function openPage(id,push=true){const found=findPage(id)||findPage('button'),item=found.item,effectiveUrl=item.url||found.parent?.url;document.querySelectorAll('.nav-item').forEach(el=>{el.classList.toggle('active',el.dataset.id===item.id);el.classList.toggle('parent-active',found.parent?.id===el.dataset.id)});const expandedParent=found.parent||((item.children?.length)?item:null);if(expandedParent){const pbtn=nav.querySelector('.nav-item[data-id="'+expandedParent.id+'"]');if(pbtn)pbtn.closest('.nav-entry').classList.add('expanded')}document.getElementById('crumbGroup').textContent=found.group;document.getElementById('crumbPage').textContent=found.parent?`${found.parent.label} / ${item.label}`:item.label;if(effectiveUrl){placeholder.classList.remove('show');frame.style.display='block';if(frame.getAttribute('src')!==effectiveUrl){pendingAnchor=item.anchor||'';frame.style.height='400px';frame.src=effectiveUrl}else if(item.anchor){scrollToFrameAnchor(item.anchor)}else{window.scrollTo({top:0,behavior:'smooth'})}}else{frame.style.display='none';placeholder.classList.add('show');document.getElementById('placeholderTitle').textContent=item.label}if(push)location.hash=item.id;sidebar.classList.remove('open')}
  nav.addEventListener('click',e=>{const sectionButton=e.target.closest('.nav-level-1');if(sectionButton){const section=sectionButton.closest('.nav-section');section.classList.toggle('collapsed');sectionButton.setAttribute('aria-expanded',String(!section.classList.contains('collapsed')));return}const item=e.target.closest('.nav-item');if(item){const entry=item.closest('.nav-entry');if(entry.classList.contains('has-sub')){if(e.target.closest('.chevron')){entry.classList.toggle('expanded');return}entry.classList.add('expanded')}openPage(item.dataset.id)}});
  const globalToast=document.getElementById('globalToast');let globalToastTimer;window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='gj-copy-feedback')return;globalToast.textContent=String(event.data.text||'已复制');globalToast.classList.add('show');clearTimeout(globalToastTimer);globalToastTimer=setTimeout(()=>globalToast.classList.remove('show'),1600)});
  document.getElementById('mobileToggle').addEventListener('click',()=>sidebar.classList.toggle('open'));window.addEventListener('hashchange',()=>openPage(location.hash.slice(1)||'button',false));openPage(location.hash.slice(1)||'button',false);
</script>
</body>
</html>
