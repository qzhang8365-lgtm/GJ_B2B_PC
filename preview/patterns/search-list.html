<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>页面模式 · 查询列表</title>
  <link rel="stylesheet" href="../../assets/styles/gj-b2b-tokens.css">
  <link rel="stylesheet" href="page-patterns.css?v=navbar-shared-2">
  <script src="../../assets/scripts/font-runtime.js"></script>
</head>
<body>
<div class="gj-app-shell"><aside class="gj-sidebar" data-gj-sidebar><div class="gj-sidebar-brand"><div class="gj-sidebar-logo"><img src="../../assets/images/preview/sidebar-logo-light.png" alt="国金证券"></div><button type="button" class="gj-sidebar-fold" data-gj-sidebar-toggle aria-label="收起侧栏" aria-expanded="true"><span style="--gj-icon:url('../../assets/icons/iconfont/icf_Arrow_fold.svg')"></span></button></div><nav class="gj-sidebar-menu" aria-label="页面模式"><a class="gj-sidebar-item" href="dashboard.html" data-pattern-page title="概览/工作台" aria-label="概览/工作台"><span class="gj-sidebar-item-main"><span class="gj-sidebar-item-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_home.svg')" aria-hidden="true"></span><span class="gj-sidebar-item-label">概览/工作台</span></span></a><a class="gj-sidebar-item is-active is-selected" href="search-list.html" data-pattern-page title="查询列表" aria-label="查询列表" aria-current="page"><span class="gj-sidebar-item-main"><span class="gj-sidebar-item-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_search.svg')" aria-hidden="true"></span><span class="gj-sidebar-item-label">查询列表</span></span></a><a class="gj-sidebar-item" href="object-detail.html" data-pattern-page title="对象详情" aria-label="对象详情"><span class="gj-sidebar-item-main"><span class="gj-sidebar-item-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_file_file-search-line.svg')" aria-hidden="true"></span><span class="gj-sidebar-item-label">对象详情</span></span></a><a class="gj-sidebar-item" href="form-edit.html" data-pattern-page title="新建/编辑表单" aria-label="新建/编辑表单"><span class="gj-sidebar-item-main"><span class="gj-sidebar-item-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_edit.svg')" aria-hidden="true"></span><span class="gj-sidebar-item-label">新建/编辑表单</span></span></a><a class="gj-sidebar-item" href="step-task.html" data-pattern-page title="分步任务" aria-label="分步任务"><span class="gj-sidebar-item-main"><span class="gj-sidebar-item-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_file_task.svg')" aria-hidden="true"></span><span class="gj-sidebar-item-label">分步任务</span></span></a></nav><nav class="gj-sidebar-menu gj-sidebar-business-menu" aria-hidden="true"><button type="button" class="gj-sidebar-item" data-id="home"><span class="gj-sidebar-item-main"><span class="gj-sidebar-item-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_home.svg')"></span><span class="gj-sidebar-item-label">工作台</span></span></button><button type="button" class="gj-sidebar-item" data-id="onboarding"><span class="gj-sidebar-item-main"><span class="gj-sidebar-item-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_add.svg')"></span><span class="gj-sidebar-item-label">机构开户</span></span><span class="gj-badge gj-badge-s gj-badge-red">3</span></button><div class="gj-sidebar-group"><button type="button" class="gj-sidebar-item is-active" data-id="customers"><span class="gj-sidebar-item-main"><span class="gj-sidebar-item-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_user_group.svg')"></span><span class="gj-sidebar-item-label">客户管理</span></span><span class="gj-sidebar-item-arrow" style="--gj-icon:url('../../assets/icons/iconfont/icf_Arrow_up.svg')"></span></button><div class="gj-sidebar-subtree"><span class="gj-sidebar-rail" aria-hidden="true"></span><div class="gj-sidebar-subtree-list"><button type="button" class="gj-sidebar-item gj-sidebar-item-second is-selected" data-id="customers-list"><span class="gj-sidebar-item-main"><span class="gj-sidebar-item-dot"></span><span class="gj-sidebar-item-label">客户列表</span></span></button><button type="button" class="gj-sidebar-item gj-sidebar-item-second" data-id="customers-create"><span class="gj-sidebar-item-main"><span class="gj-sidebar-item-dot"></span><span class="gj-sidebar-item-label">新建客户</span></span></button><button type="button" class="gj-sidebar-item gj-sidebar-item-second" data-id="customers-detail"><span class="gj-sidebar-item-main"><span class="gj-sidebar-item-dot"></span><span class="gj-sidebar-item-label">客户详情</span></span></button></div></div></div></nav></aside><script src="../../assets/scripts/gj-sidebar.js?v=1"></script><div class="gj-app-main">
<header class="gj-navbar" data-gj-navbar data-surface="white" data-menu="false" data-search-box-visible="true" data-icon-group-visible="true" data-avatar-visible="true" aria-label="全局顶部导航"><span class="gj-navbar-spacer"></span><div class="gj-navbar-actions"><div class="gj-search" data-search-box><span class="gj-search-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_search.svg')" aria-hidden="true"></span><input class="gj-search-input" type="search" placeholder="输入关键词搜索" aria-label="搜索"></div><div class="gj-navbar-icon-group"><button type="button" class="gj-navbar-icon-btn" aria-label="邮件"><span class="gj-navbar-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_contact_mail.svg')" aria-hidden="true"></span></button><button type="button" class="gj-navbar-icon-btn" aria-label="通知"><span class="gj-navbar-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_bell.svg')" aria-hidden="true"></span></button></div><span class="gj-navbar-divider" aria-hidden="true"></span><button type="button" class="gj-navbar-user" aria-label="用户菜单"><span class="gj-avatar gj-avatar-32"><span class="gj-avatar-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_user_user-fill.svg')" aria-hidden="true"></span></span><span>李文</span></button></div></header>
<main class="page query-page">
  <div class="pattern-label">页面模式 · 查询列表</div>
  <nav class="gj-breadcrumb" aria-label="面包屑"><button class="gj-breadcrumb-item" type="button">文档管理</button><span class="gj-breadcrumb-separator" aria-hidden="true">/</span><button class="gj-breadcrumb-item" type="button" aria-current="page" disabled>文档列表</button></nav>
  <header class="page-head query-page-head">
    <div><h1>文档列表</h1><p>查询、维护和批量处理研究文档。</p></div>
    <button class="gj-btn gj-btn-primary"><span class="gj-btn-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_add.svg')" aria-hidden="true"></span>新建文档</button>
  </header>

  <form id="queryForm" class="card query-filter">
    <div class="query-filter-grid">
      <div class="query-filter-pair"><label class="gj-form-label gj-form-label-horizontal" for="categoryFilter">文档类别：</label><select id="categoryFilter" class="gj-select"><option value="">全部类别</option><option value="研报">研报</option><option value="公告">公告</option><option value="制度文件">制度文件</option></select></div>
      <div class="query-filter-pair"><label class="gj-form-label gj-form-label-horizontal" for="statusFilter">发布状态：</label><select id="statusFilter" class="gj-select"><option value="">全部状态</option><option value="已发布">已发布</option><option value="处理中">处理中</option><option value="草稿">草稿</option><option value="已驳回">已驳回</option></select></div>
      <div class="query-filter-pair"><label class="gj-form-label gj-form-label-horizontal" for="sourceFilter">文档来源：</label><select id="sourceFilter" class="gj-select"><option value="">全部来源</option><option value="系统上传">系统上传</option><option value="外部同步">外部同步</option><option value="人工录入">人工录入</option></select></div>
      <div class="query-filter-pair"><label class="gj-form-label gj-form-label-horizontal" for="ownerFilter">创建者：</label><input id="ownerFilter" class="gj-input" placeholder="请输入姓名"></div>
    </div>
    <div class="query-filter-row secondary">
      <div class="query-filter-pair query-search-pair"><label class="gj-form-label gj-form-label-horizontal" for="keywordFilter">文档搜索：</label><span class="gj-search"><img class="gj-search-icon" src="../../assets/icons/iconfont/icf_system_search.svg" alt=""><input id="keywordFilter" class="gj-search-input" placeholder="请输入文档名称/因子 ID"></span></div>
      <div class="query-filter-pair query-date-pair"><label class="gj-form-label gj-form-label-horizontal" for="dateRangeTrigger">修改日期：</label><div class="gj-date-picker" data-gj-date-picker><input id="dateFrom" name="dateFrom" type="hidden"><input id="dateTo" name="dateTo" type="hidden"><button id="dateRangeTrigger" class="gj-date-trigger gj-date-trigger-range" type="button" aria-haspopup="dialog" aria-expanded="false"><span class="gj-date-part" data-date-start>开始日期</span><span class="gj-date-separator">→</span><span class="gj-date-part" data-date-end>结束日期</span><span class="gj-date-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_calendar.svg')" aria-hidden="true"></span></button><div class="gj-date-range-panel" data-date-panel role="dialog" aria-label="选择修改日期范围" hidden></div></div></div>
      <button id="moreFilterToggle" class="gj-btn query-more-filter" type="button" aria-expanded="false" aria-controls="advancedFilters">更多筛选<span class="gj-btn-icon query-more-arrow" style="--gj-icon:url('../../assets/icons/iconfont/icf_Arrow_arrow-down.svg')" aria-hidden="true"></span></button>
      <div class="query-filter-actions"><button id="queryButton" class="gj-btn gj-btn-primary" type="submit"><span class="gj-btn-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_search-fill.svg')" aria-hidden="true"></span><span>查询</span></button><button id="resetButton" class="gj-btn gj-btn-secondary" type="reset"><span class="gj-btn-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_refresh2.svg')" aria-hidden="true"></span>重置</button></div>
    </div>
    <div id="advancedFilters" class="query-filter-grid query-advanced" hidden>
      <div class="query-filter-pair"><label class="gj-form-label gj-form-label-horizontal" for="sizeFilter">文档大小：</label><select id="sizeFilter" class="gj-select"><option value="">全部大小</option><option value="small">小于 10 MB</option><option value="medium">10–50 MB</option><option value="large">大于 50 MB</option></select></div>
      <div class="query-filter-pair"><label class="gj-form-label gj-form-label-horizontal" for="marketFilter">所属市场：</label><select id="marketFilter" class="gj-select"><option value="">全部市场</option><option value="A股">A股</option><option value="ETF">ETF</option><option value="基金">基金</option></select></div>
    </div>
    <div id="activeFilters" class="query-active-filters" aria-live="polite" hidden><span class="query-active-label">已生效条件</span><div id="activeFilterTags" class="query-active-tags"></div><button id="clearFilters" class="gj-text-btn gj-text-btn-small" type="button">清除全部</button></div>
  </form>

  <section class="card query-list-card" aria-labelledby="listTitle">
    <div class="query-list-toolbar"><div><h2 id="listTitle" class="query-list-title">文档数据</h2><span id="resultSummary" class="query-result-summary"></span></div><div class="query-list-actions"><button class="gj-btn"><span class="gj-btn-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_file_upload.svg')" aria-hidden="true"></span>批量上传</button><button class="gj-btn"><span class="gj-btn-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_file_file-export-line.svg')" aria-hidden="true"></span>导出结果</button></div></div>
    <div id="bulkBar" class="query-bulk-bar" hidden><div><strong id="selectionCount">已选择 0 项</strong><button id="clearSelection" class="gj-text-btn" type="button">取消选择</button></div><div class="query-bulk-actions"><button id="downloadSelected" class="gj-btn"><span class="gj-btn-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_file_download.svg')" aria-hidden="true"></span>下载</button><select id="bulkStatus" class="gj-select" aria-label="批量修改状态"><option value="">修改状态</option><option value="已发布">设为已发布</option><option value="草稿">设为草稿</option></select><button id="deleteSelected" class="gj-btn gj-btn-danger" type="button"><span class="gj-btn-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_delete.svg')" aria-hidden="true"></span>删除</button></div></div>

    <div id="tableRegion" class="query-table-region" aria-live="polite">
      <div class="gj-table-wrap"><table class="gj-table query-table"><thead><tr><th><input id="selectAll" class="gj-checkbox" type="checkbox" aria-label="全选当前页"></th><th>文档名称</th><th>因子 ID</th><th>文档类别</th><th>状态</th><th>大小</th><th>创建者</th><th id="updatedHeader" aria-sort="descending"><button id="sortUpdated" class="gj-table-sort" type="button">最近修改<span class="gj-table-sort-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_Arrow_caret.svg')" aria-hidden="true"></span></button></th><th class="gj-table-action">操作</th></tr></thead><tbody id="tableBody"></tbody></table></div>
      <div id="queryEmpty" class="gj-empty-state query-empty" hidden><div class="gj-empty-state__main"><img class="gj-empty-state__illustration" src="../../assets/images/empty/notfound.png" alt="" aria-hidden="true"><div class="gj-empty-state__copy"><span class="gj-empty-state__title">未找到符合条件的文档</span><span class="gj-empty-state__description">请调整或清除筛选条件后重新查询。</span></div></div><button id="emptyClear" class="gj-btn gj-btn-secondary" type="button">清除筛选</button></div>
    </div>

    <footer id="listFooter" class="query-list-footer"><div id="totalCount" class="query-total"></div><div class="query-pagination-controls"><label class="query-page-size"><span>每页</span><select id="pageSize" class="gj-select gj-select-small"><option value="10">10 条</option><option value="20" selected>20 条</option><option value="50">50 条</option></select></label><nav id="pagination" class="gj-pagination" aria-label="列表分页"></nav><label class="query-page-jump"><span>跳至</span><input id="pageJump" class="gj-input gj-input-small" inputmode="numeric" aria-label="跳转页码"><span>页</span></label></div></footer>
  </section>
</main></div></div>

<div id="actionMenu" class="gj-dropdown query-action-menu" role="menu" hidden><button class="gj-dropdown-item" role="menuitem" data-action="copy"><span class="gj-dropdown-label">复制因子 ID</span></button><button class="gj-dropdown-item query-danger-item" role="menuitem" data-action="delete"><span class="gj-dropdown-label">删除文档</span></button></div>
<div id="modalLayer" class="gj-modal-layer" hidden><section class="gj-modal gj-modal-sm" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="gj-modal-header"><h2 id="modalTitle">确认删除</h2><button id="modalClose" class="gj-modal-close" type="button" data-modal-close aria-label="关闭"><span style="--gj-icon:url('../../assets/icons/iconfont/icf_system_close.svg')" aria-hidden="true"></span></button></header><div class="gj-modal-content"><div class="gj-modal-feedback gj-modal-feedback-alert"><span class="gj-modal-feedback-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_warning-fill.svg')" aria-hidden="true"></span><div class="gj-modal-feedback-copy"><strong class="gj-modal-feedback-title" id="modalMessage">删除后数据将无法恢复，请确认是否继续。</strong></div></div></div><footer class="gj-modal-footer"><button id="modalCancel" class="gj-btn" type="button">取消</button><button id="modalConfirm" class="gj-btn gj-btn-primary gj-btn-delete" type="button">删除</button></footer></section></div>
<div id="queryToast" class="gj-toast gj-toast-fixed gj-toast-black" role="status" aria-live="polite" hidden></div>

<script src="../../assets/scripts/gj-selector.js?v=selector-3"></script>
<script src="../../assets/scripts/gj-date-picker.js?v=hover-1"></script>
<script src="search-list.js?v=hover-1"></script><script src="../../assets/scripts/gj-table-overflow.js?v=1"></script>
</body>
</html>
