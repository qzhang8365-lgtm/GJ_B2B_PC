  <div class="pattern-label">页面模式 · 新建/编辑表单</div><nav class="gj-breadcrumb" aria-label="面包屑"><button class="gj-breadcrumb-item" type="button">客户管理</button><span class="gj-breadcrumb-separator" aria-hidden="true">/</span><button class="gj-breadcrumb-item" type="button" aria-current="page" disabled>新建机构客户</button></nav>
  <header class="page-head"><div><h1>新建机构客户</h1><p>填写客户基本资料、联系信息和业务归属</p></div></header>
  <section class="card"><h2 class="card-title">基本信息</h2><div class="form-grid">
    <div class="gj-form-item gj-form-item-vertical span-2"><label class="gj-form-label gj-form-label-required">客户名称</label><div class="gj-input-wrap outlined medium"><input placeholder="请输入营业执照上的完整名称"></div><span class="gj-form-help">名称保存后可发起重复客户校验</span></div>
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label gj-form-label-required">客户类型</label><select class="gj-select"><option value="">请选择</option><option>金融机构</option><option>企业客户</option></select></div>
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label gj-form-label-required">统一社会信用代码</label><div class="gj-input-wrap outlined medium"><input placeholder="18 位统一社会信用代码"></div></div>
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label">客户简称</label><div class="gj-input-wrap outlined medium"><input placeholder="请输入简称"></div></div>
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label">客户来源</label><div class="gj-radio-group"><label class="gj-radio-label"><input class="gj-radio" type="radio" name="customer-source" checked><span>直签</span></label><label class="gj-radio-label"><input class="gj-radio" type="radio" name="customer-source"><span>渠道推荐</span></label><label class="gj-radio-label"><input class="gj-radio" type="radio" name="customer-source"><span>存量转化</span></label></div></div>
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label gj-form-label-required">所属地区</label><div class="gj-selector gj-cascader-field" data-gj-cascader-field><button class="gj-selector-trigger" type="button" data-gj-cascader-trigger aria-haspopup="dialog" aria-expanded="false" aria-controls="regionCascader"><span class="gj-selector-placeholder" data-gj-cascader-value>请选择省 / 市</span><span class="gj-selector-arrow" style="--gj-icon:url('../../assets/icons/iconfont/icf_Arrow_down.svg')" aria-hidden="true"></span></button><div id="regionCascader" class="gj-cascader gj-cascader-popup" data-gj-cascader-popup role="dialog" aria-label="选择所属地区" hidden><div class="gj-cascader-column" data-cascader-column="0"><button type="button" class="gj-cascader-item" data-value="四川省" data-child-key="sichuan" data-has-children="true"><span class="gj-cascader-label">四川省</span><i class="gj-cascader-icon gj-cascader-arrow" style="--i:url('../../assets/icons/iconfont/icf_Arrow_right.svg')"></i></button><button type="button" class="gj-cascader-item" data-value="广东省" data-child-key="guangdong" data-has-children="true"><span class="gj-cascader-label">广东省</span><i class="gj-cascader-icon gj-cascader-arrow" style="--i:url('../../assets/icons/iconfont/icf_Arrow_right.svg')"></i></button><button type="button" class="gj-cascader-item" data-value="江苏省" data-child-key="jiangsu" data-has-children="true"><span class="gj-cascader-label">江苏省</span><i class="gj-cascader-icon gj-cascader-arrow" style="--i:url('../../assets/icons/iconfont/icf_Arrow_right.svg')"></i></button></div><div class="gj-cascader-column" data-cascader-column="1" hidden><button type="button" class="gj-cascader-item" data-parent-key="sichuan" data-value="成都市" data-leaf="true"><span class="gj-cascader-label">成都市</span><i class="gj-cascader-icon gj-cascader-selected-icon" style="--i:url('../../assets/icons/iconfont/icf_system_check.svg')" aria-hidden="true"></i></button><button type="button" class="gj-cascader-item" data-parent-key="sichuan" data-value="绵阳市" data-leaf="true"><span class="gj-cascader-label">绵阳市</span><i class="gj-cascader-icon gj-cascader-selected-icon" style="--i:url('../../assets/icons/iconfont/icf_system_check.svg')" aria-hidden="true"></i></button><button type="button" class="gj-cascader-item" data-parent-key="guangdong" data-value="广州市" data-leaf="true"><span class="gj-cascader-label">广州市</span><i class="gj-cascader-icon gj-cascader-selected-icon" style="--i:url('../../assets/icons/iconfont/icf_system_check.svg')" aria-hidden="true"></i></button><button type="button" class="gj-cascader-item" data-parent-key="guangdong" data-value="深圳市" data-leaf="true"><span class="gj-cascader-label">深圳市</span><i class="gj-cascader-icon gj-cascader-selected-icon" style="--i:url('../../assets/icons/iconfont/icf_system_check.svg')" aria-hidden="true"></i></button><button type="button" class="gj-cascader-item" data-parent-key="jiangsu" data-value="南京市" data-leaf="true"><span class="gj-cascader-label">南京市</span><i class="gj-cascader-icon gj-cascader-selected-icon" style="--i:url('../../assets/icons/iconfont/icf_system_check.svg')" aria-hidden="true"></i></button><button type="button" class="gj-cascader-item" data-parent-key="jiangsu" data-value="苏州市" data-leaf="true"><span class="gj-cascader-label">苏州市</span><i class="gj-cascader-icon gj-cascader-selected-icon" style="--i:url('../../assets/icons/iconfont/icf_system_check.svg')" aria-hidden="true"></i></button></div></div></div></div>
  </div></section>
  <section class="card"><h2 class="card-title">联系与归属</h2><div class="form-grid">
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label gj-form-label-required">联系人</label><div class="gj-input-wrap outlined medium"><input placeholder="请输入姓名"></div></div>
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label gj-form-label-required">联系电话</label><div class="gj-input-wrap outlined medium"><input placeholder="请输入手机号或座机"></div></div>
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label">联系邮箱</label><div class="gj-input-wrap outlined medium"><input placeholder="name@example.com"></div></div>
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label gj-form-label-required">客户负责人</label><select class="gj-select"><option value="">请选择负责人</option><option>张明</option><option>李然</option></select></div>
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label gj-form-label-required">归属部门</label><select class="gj-select"><option>机构业务部</option><option>财富业务部</option></select></div>
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label">短信提醒</label><label class="gj-switch"><input type="checkbox" checked><span class="gj-switch-track"><span class="gj-switch-thumb"><img src="../../assets/icons/switch-thumb-medium.svg" alt=""></span></span></label><span class="gj-form-help">开启后关键节点会通过短信通知负责人</span></div>
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label">预约回访时间</label><button type="button" class="gj-time-trigger gj-time-trigger-has-value"><span>14:30</span><span class="gj-time-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_system_time.svg')" aria-hidden="true"></span></button></div>
    <div class="gj-form-item gj-form-item-vertical full"><label class="gj-form-label">备注</label><div class="gj-input-wrap outlined medium textarea-wrap"><textarea placeholder="请输入补充说明，最多 500 字"></textarea></div></div>
  </div></section>
  <section class="card"><h2 class="card-title">补充材料</h2><div class="form-grid">
    <div class="gj-form-item gj-form-item-vertical"><label class="gj-form-label">首次预计入金金额</label><label class="gj-number-input gj-number-input-unit"><input placeholder="请输入金额" inputmode="decimal"><span class="gj-number-input-unit-label">万元</span></label><span class="gj-form-help">用于业务规模预估，非必填</span></div>
    <div class="gj-form-item gj-form-item-vertical span-2"><label class="gj-form-label">资质证明材料</label><div class="gj-upload-dropzone"><span class="gj-upload-dropzone-icon" style="--gj-icon:url('../../assets/icons/iconfont/icf_file_upload.svg')" aria-hidden="true"></span><p class="gj-upload-dropzone-title">点击或拖拽文件到此处上传</p><p class="gj-upload-dropzone-hint">支持 PDF、JPG、PNG，单个文件不超过 10MB</p></div><div class="upload-thumb-row"><div class="gj-image-thumb"><img class="gj-image-thumb-img" src="../../assets/images/preview/image-component-sample.png" alt="营业执照扫描件"></div><div class="gj-image-thumb"><img class="gj-image-thumb-img" src="../../assets/images/preview/image-component-sample.png" alt="开户许可证扫描件"></div></div></div>
  </div></section>
  <div class="gj-form-actions form-actions-after-card"><button class="gj-btn">取消</button><button class="gj-btn">保存草稿</button><button class="gj-btn gj-btn-primary">创建客户</button></div>
</main></div></div><script src="../../assets/scripts/gj-selector.js?v=selector-3"></script><script src="../../assets/scripts/gj-cascader.js?v=1"></script></body></html>
